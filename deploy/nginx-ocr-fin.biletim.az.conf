# Public HTTPS reverse proxy for https://ocr-fin.biletim.az
# TLS terminates here; uvicorn stays on 127.0.0.1:8010.
# Do NOT proxy Streamlit on this host publicly.
#
# Install (Debian/Ubuntu style):
#   sudo cp deploy/nginx-ocr-fin.biletim.az.conf /etc/nginx/sites-available/ocr-fin.biletim.az
#   sudo ln -sf /etc/nginx/sites-available/ocr-fin.biletim.az /etc/nginx/sites-enabled/
#   # If certs are not issued yet, use certbot (see README simple.md), then:
#   sudo nginx -t && sudo systemctl reload nginx

upstream ocr_fin_api {
    server 127.0.0.1:8010;
    keepalive 8;
}

server {
    listen 80;
    listen [::]:80;
    server_name ocr-fin.biletim.az;

    # Allow HTTP-01 challenges for Let's Encrypt / certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ocr-fin.biletim.az;

    # Default Let's Encrypt paths. If network team issued different certs,
    # replace these two lines with their certificate + key paths.
    ssl_certificate     /etc/letsencrypt/live/ocr-fin.biletim.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ocr-fin.biletim.az/privkey.pem;

    # Batch uploads can be large (see MAX_BATCH_BYTES).
    client_max_body_size 60m;

    location / {
        proxy_pass http://ocr_fin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
